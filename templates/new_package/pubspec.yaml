name: my_new_package
resolution: workspace
description: A new package in the Scotch Software monorepo.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Riverpod
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0
  # Freezed (runtime)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Codegen
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  # Testing
  mocktail: ^1.0.0
  # Linting
  flutter_lints: ^6.0.0
