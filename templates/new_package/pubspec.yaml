name: my_new_package
description: A new package in the Scotch Software monorepo.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Riverpod
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  # Freezed (runtime)
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Codegen
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  # Testing
  mocktail: ^1.0.0
  # Linting
  very_good_analysis: ^7.0.0
